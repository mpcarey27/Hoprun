name = "hoprun"
main = "functions/worker.ts"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "hoprun.app", custom_domain = true },
  { pattern = "www.hoprun.app", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare Free Tier D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "acr_running_db"
database_id = "01fb2ca5-2fbf-4d2a-aaac-692d54b551e1"

# Hourly Cron Trigger: dispatches daily workout briefing emails
[triggers]
crons = ["0 * * * *"]
